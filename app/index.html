<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0A1428" id="tc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deepu Verma">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Deepu Verma | Portfolio App</title>
<meta name="description" content="Deepu Verma's portfolio as an installable app: projects, certificates, industrial visits, resume and contact.">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{--bg:#0A1428;--surface:#101D38;--accent:#D4AF37;--accent2:#E6C766;--text:#F8FAFC;--muted:#A9B4C8;--line:rgba(212,175,55,.18);--glass:rgba(16,29,56,.88);--r:14px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--onacc:#0A1428}
:root[data-theme=light]{--bg:#FAF7F0;--surface:#fff;--accent:#8A6D12;--accent2:#6F570D;--text:#0A1428;--muted:#4B5563;--line:rgba(10,20,40,.14);--glass:rgba(255,255,255,.92);--onacc:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;transition:background .3s,color .3s;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-weight:700;line-height:1.2;letter-spacing:-.01em}
a{color:var(--accent2)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px;border-radius:6px}

/* shell */
#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#app:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.35;mask-image:radial-gradient(ellipse at 70% 0,#000,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 0,#000,transparent 70%)}
@media(min-width:700px){body{display:grid;place-items:center}#app{height:min(900px,calc(100dvh - 32px));border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}}
.bar{flex:none;position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 8px) 14px 8px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font:700 1.3rem "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text)}
.logo b{color:var(--accent2)}
.bar h1{flex:1;font-size:1rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.acts{display:flex;gap:8px}
.ic{display:grid;place-items:center;background:none;border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:1.1rem;padding:0}
.ic:active{border-color:var(--accent2);transform:scale(.94)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#inst{display:none;width:auto;padding:0 12px;font-size:.82rem;color:var(--accent2);gap:6px;grid-auto-flow:column;align-items:center}
#offl{display:none;font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
body.off #offl{display:inline-block}
#view{flex:1;position:relative;z-index:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;outline:none}
#view.enter>*{animation:in .26s ease backwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabs{flex:none;position:relative;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sb))}
body.kb .tabs{display:none}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;color:var(--muted);cursor:pointer;font-size:.7rem;min-height:56px;justify-content:center}
.tab span.pill{display:grid;place-items:center;width:58px;height:30px;border-radius:16px;transition:background .25s,transform .15s}
.tab:active span.pill{transform:scale(.92)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent2);font-weight:600}
.tab[aria-current=page] span.pill{background:var(--line)}

/* shared components (same look as the website) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--onacc);font:600 .95rem "Segoe UI",system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97);background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:active{border-color:var(--accent);background:transparent}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-disabled=true]{opacity:.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:transform .15s,border-color .2s}
.card+.card,.card+.grid,.grid+.card,.lead+.card{margin-top:14px}
.grid>.card,.grid>.card+.card{margin-top:0}
.tap{cursor:pointer;text-align:left;width:100%;display:block}
.tap:active{transform:scale(.985);border-color:var(--accent)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row.c{justify-content:center}
.lead{color:var(--muted);margin-bottom:18px}
.sh{font-size:1.45rem;margin:34px 0 10px}
.sh:first-child{margin-top:4px}
.sh:after{content:"";display:block;width:56px;height:3px;background:var(--accent);border-radius:3px;margin-top:10px}
.grp{margin:26px 0 12px;font-size:1.15rem}
.grp small{color:var(--muted);font:500 .85rem "Segoe UI",sans-serif;margin-left:8px}
.card h3{font-size:1.1rem;margin-bottom:6px}
.card p{color:var(--muted);font-size:.93rem}
.tag{display:inline-block;font-size:.78rem;color:var(--accent2);margin-bottom:6px}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.info b{display:block;color:var(--accent2);font-size:.85rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.ph{aspect-ratio:16/9;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.8rem;margin-bottom:14px;background:repeating-linear-gradient(45deg,transparent 0 10px,var(--line) 10px 11px);overflow:hidden;text-align:center;padding:8px}
.ph img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
dl{display:grid;gap:12px;margin:14px 0}
dt{color:var(--accent2);font-size:.85rem}
dd{margin:0;color:var(--muted);font-size:.93rem}
details.cs{margin-top:12px}details.cs summary{list-style:none;cursor:pointer;text-align:center;margin-top:0}details.cs summary::-webkit-details-marker{display:none}details.cs[open]>summary{margin-bottom:12px}details.cs dl{margin:0}details.cs ul{margin:0;padding-left:18px;display:grid;gap:8px;color:var(--muted);font-size:.93rem}details.cs details.cs{margin-top:14px}
.tl{border-left:2px solid var(--accent);padding-left:16px;margin-left:4px}
.tl .card{margin-bottom:14px}
.xl{display:flex;gap:14px;align-items:flex-start}.xl svg{width:34px;height:34px;flex:none;color:var(--accent);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.xl h3{font-size:1.02rem;margin-bottom:4px}
.sem .sg{display:block;font:700 1.5rem "Segoe UI",system-ui,sans-serif;color:var(--accent);margin:4px 0}.sem.wait{opacity:.6;border-style:dashed}
.sem .btn{margin-top:12px;min-height:40px;width:100%}

/* segmented control + chips bar */
.segwrap{position:sticky;top:0;z-index:3;margin:-16px -16px 14px;padding:12px 16px 8px;background:var(--bg);box-shadow:0 10px 14px -10px rgba(0,0,0,.45)}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;min-height:40px;border-radius:999px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.9rem}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--onacc);font-weight:600}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font-size:.9rem}
.filters button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:42px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}

/* certificate rows */
.crow{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left;cursor:pointer}
.crow:active{transform:scale(.985);border-color:var(--accent)}
.crow .th{flex:none;width:64px;height:90px;border-radius:8px;border:1px solid var(--line);overflow:hidden;background:var(--bg)}
.crow .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.crow h3{font-size:1rem;margin-bottom:3px}
.crow p{color:var(--muted);font-size:.85rem}
.crow .note{margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:36px 0}

/* home */
.hero{position:relative;text-align:center;padding:6px 0 4px}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.25;pointer-events:none;animation:flt 9s ease-in-out infinite}
.o1{width:220px;height:220px;background:var(--accent);top:-50px;right:0}.o2{width:200px;height:200px;background:#3B6FD4;bottom:-40px;left:0;animation-delay:-4s}
.photo-wrap{position:relative;display:grid;place-items:center;padding:20px}
.photo-wrap:before{content:"";position:absolute;width:min(230px,66vw);aspect-ratio:1;border-radius:50%;border:2px dashed var(--accent);opacity:.55;animation:spin 26s linear infinite}
.photo{width:min(200px,56vw);aspect-ratio:1;border-radius:50%;border:3px solid var(--accent);background:var(--surface);box-shadow:0 0 0 8px rgba(212,175,55,.12),0 20px 50px rgba(0,0,0,.4);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 16%}
.eyebrow{color:var(--accent2);font-size:.8rem;letter-spacing:.08em}
.h1{font-size:clamp(2rem,9vw,2.6rem);margin:8px 0}
.h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.role{font-size:1.15rem;color:var(--accent2)!important;min-height:1.8em}
.cur{display:inline-block;width:2px;height:1.1em;background:var(--accent);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(2) infinite}
.intro{color:var(--muted);margin:10px 0 20px;position:relative}
.hero .row{position:relative}
.social{display:flex;gap:10px;justify-content:center;margin-top:18px;position:relative}.social a{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--text)}.social a:active{border-color:var(--accent);color:var(--accent)}.social svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.glance{margin-top:22px}.glance .card{text-align:center;padding:16px}.glance b{display:block;font:700 1.15rem "Segoe UI",system-ui,sans-serif;color:var(--accent)}.glance span{font-size:.82rem;color:var(--muted)}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;margin:0!important}
.tile svg{width:28px;height:28px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:1rem}
.tile span{font-size:.8rem;color:var(--muted);line-height:1.35}
.banner{display:none;align-items:center;gap:12px;margin-top:18px}
.banner.show{display:flex}
.banner p{flex:1;font-size:.88rem}
.banner .btn{min-height:40px;padding:0 16px;margin:0}
.foot{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes flt{50%{transform:translateY(-12px)}}@keyframes shine{to{background-position:200% center}}@keyframes blink{50%{opacity:0}}

/* contact */
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.acts2 .btn{min-height:48px;padding:0 10px}
form{display:grid;gap:14px}
label{font-size:.9rem;display:block;margin-bottom:4px}
input,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px}
textarea{min-height:120px;resize:vertical}
.err{color:#F87171;font-size:.82rem;min-height:1em}
[data-theme=light] .err{color:#B91C1C}
#status{font-size:.9rem;color:var(--muted)}

/* viewer, sheet, toast, splash */
#viewer,#sheet{position:absolute;inset:0;z-index:50;display:none}
#viewer{flex-direction:column;background:var(--bg)}
#viewer.open{display:flex;animation:up .28s ease both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.vbar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 8px) 14px 8px;background:var(--glass);border-bottom:1px solid var(--line)}
.vbar h2{flex:1;font-size:1rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vbar small{color:var(--muted);font-size:.8rem}
#vbody{flex:1;overflow:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
.vimg{overflow:auto;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.vimg img{display:block;width:100%;height:auto;cursor:zoom-in}
.vimg.zoom img{width:220%;max-width:none;cursor:zoom-out}
.vhint{font-size:.78rem;color:var(--muted);text-align:center;margin:8px 0}
.vnav{flex:none;display:flex;gap:12px;padding:10px 14px calc(10px + var(--sb));border-top:1px solid var(--line);background:var(--glass)}
.vnav .btn{flex:1;min-height:44px}
#sheet{background:rgba(0,0,0,.6)}
#sheet.open{display:flex;align-items:flex-end;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sbox{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + var(--sb));animation:up .28s ease both}
.sbox h3{margin-bottom:10px}
.sbox ol{padding-left:20px;display:grid;gap:8px;color:var(--muted);margin-bottom:16px}
#toast{position:absolute;left:16px;right:16px;bottom:calc(84px + var(--sb));z-index:70;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;font-size:.9rem;display:flex;align-items:center;justify-content:space-between;gap:12px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent2);font-weight:700;cursor:pointer;padding:4px 8px}
#splash{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .45s,visibility .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash .mark{font:700 3.4rem "Segoe UI",system-ui,sans-serif;animation:pop .7s ease both}
#splash .mark b{color:var(--accent2)}
#splash p{color:var(--muted);letter-spacing:.14em;font-size:.8rem;animation:in .7s .15s ease both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
 <header class="bar">
  <span class="logo" aria-hidden="true">DV<b>.</b></span>
  <h1 id="ttl">Home</h1>
  <span id="offl">Offline</span>
  <div class="acts">
   <button class="ic" id="inst" type="button" aria-label="Install this app"></button>
   <button class="ic" id="share" type="button" aria-label="Share this app"></button>
   <button class="ic" id="theme" type="button" aria-label="Switch to light theme">☾</button>
  </div>
 </header>
 <main id="view" tabindex="-1" aria-live="polite"></main>
 <nav class="tabs" id="tabs" aria-label="Main"></nav>

 <div id="viewer" role="dialog" aria-modal="true" aria-labelledby="vt">
  <div class="vbar"><button class="ic" id="vclose" type="button" aria-label="Close">✕</button><h2 id="vt"></h2><small id="vcount"></small></div>
  <div id="vbody"></div>
  <div class="vnav" id="vnav"><button class="btn ghost" id="vprev" type="button">‹ Previous</button><button class="btn ghost" id="vnext" type="button">Next ›</button></div>
 </div>
 <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="sbox" id="sbox"></div></div>
 <div id="toast" role="status" aria-live="polite"></div>
 <div id="splash" aria-hidden="true"><div class="mark">DV<b>.</b></div><p>DEEPU VERMA</p></div>
</div>
<noscript><p style="padding:24px;color:#fff">This app needs JavaScript. Please enable it.</p></noscript>
<script src="../content.js"></script>
<script src="app.js"></script>
</body>
</html>
